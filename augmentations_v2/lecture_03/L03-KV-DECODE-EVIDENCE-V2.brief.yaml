teachingQuestion: "Why does token-by-token decoding make KV sharing valuable, and what evidence limits the claim that more sharing is always better?"
additiveClaim: "The lecture's equations and diagrams are separated across six slides; the companion keeps the growing decode read, exact cache-byte multiplier, fixed query-head count, KV-sharing knob, and page 63 evidence boundary visible as one causal chain."
evidenceBoundary:
  lectureEvidence: "Slides 58-60 establish poor incremental arithmetic intensity and repeated KV-cache access; slides 61-62 introduce MQA then GQA; slide 63 labels a small MQA perplexity hit and low/no GQA hit in cited results."
  augmentationEvidence: "The 8-query-head BF16, 128-head-dimension, 32-layer, 4096-token, batch-1 byte totals are declared reproduced calculations, not lecture model measurements."
caveat: "KV-cache bytes scale exactly with the declared dimensions, but realized latency also depends on kernels, batching, hardware, layout, and other memory traffic. Page 63 quality observations are empirical results in cited settings, not universal guarantees."
medium: interactive-companion-plus-production-video
rejectedMedia:
  - "Head-family glossary: beginning with MHA/GQA/MQA would hide the decode systems problem that motivates sharing."
  - "Standalone evidence redraw: the paper plots must remain connected to official slide 63."
  - "Formula-only card: a static equation cannot show the cache being reread and growing at every decode step."
audio: silent
expectedLearnerTimeSeconds: 54.8
anchors:
