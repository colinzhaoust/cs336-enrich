declaredConfiguration:
  provenance: declared-toy-configuration
  queryHeads: 8
  headDimension: 128
  bytesPerValue: 2
  dtype: BF16
  layers: 32
  sequenceTokens: 4096
  batch: 1
formulas:
  perCachedTokenPerLayer: "2 * n_kv_heads * d_head * bytes_per_value"
  modelTotal: "per_cached_token_per_layer * sequence_tokens * n_layers * batch"
beats:
  - id: prefill-vs-decode
    startSeconds: 0
    endSeconds: 5
    change: "Contrast a parallel prefill pass with one serial decode step."
    settledState: "Decode adds one query token while attending to the existing context."
    dwellSeconds: 4
    sourceSupport: "slides 58-59"
  - id: growing-kv-read
    startSeconds: 5
    endSeconds: 13
    change: "Append three tokens; each step rereads the growing K/V history."
    settledState: "The cache avoids recomputing prior K/V, but prior K/V must be moved again for each new token."
    dwellSeconds: 6
    sourceSupport: "slides 59-60"
  - id: exact-byte-ledger
    startSeconds: 13
    endSeconds: 21
    change: "Freeze motion and expose the per-token/per-layer formula before multiplying across sequence, layers, and batch."
    settledState: "MHA toy total is 4 KiB per cached token per layer and 512 MiB model-wide at 4096 tokens, 32 layers, batch 1."
    dwellSeconds: 7
    sourceSupport: "slides 58-60 plus declared reproduced calculation"
  - id: mha-repeated-read
    startSeconds: 21
    endSeconds: 28
    change: "Hold eight query heads fixed and show eight separate K/V streams."
    settledState: "MHA: n_q_heads=8, n_kv_heads=8, relative KV traffic 1x."
    dwellSeconds: 6
    sourceSupport: "slides 60-62"
  - id: mqa-extreme
    startSeconds: 28
    endSeconds: 35
    change: "Collapse only K/V streams to one while queries remain eight."
    settledState: "MQA: 1 KV head, 1/8 toy cache bytes; marked as an expressiveness/capacity extreme, not automatically better."
    dwellSeconds: 5
    sourceSupport: "slide 61"
  - id: gqa-knob
    startSeconds: 35
    endSeconds: 42
    change: "Expand to two KV groups and expose KV-head count as the capacity/traffic knob."
    settledState: "GQA toy point: 2 KV heads, 1/4 MHA cache bytes; query heads remain eight."
    dwellSeconds: 6
    sourceSupport: "slide 62"
  - id: evidence-caveat
    startSeconds: 42
    endSeconds: 54.8
    change: "Stop motion and return attention to official slide 63 evidence."
    settledState: "Course slide: small MQA PPL hit in Shazeer 2019 setting; low/no GQA hit in Ainslie 2023 setting; neither is universal."
    dwellSeconds: 8
    sourceSupport: "slide 63"
